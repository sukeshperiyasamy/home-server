# ==============================================================================
# Home Server - Docker Compose Specification
# ==============================================================================
# This file serves as the single source of truth for services running on the
# home server.
#
# DESIGN PRINCIPLES:
# 1. Reproducible: Uses environment variables defined in .env
# 2. Portable: Persistent volumes bind mount directly to ${STORAGE_ROOT}/app-data
# 3. Pinned: Use explicit image versions rather than 'latest' where practical
# ==============================================================================

name: home-server

services:
  portainer:
    image: portainer/portainer-ce:2.27.1-alpine
    container_name: portainer
    restart: unless-stopped
    ports:
      # Bound strictly to Raspberry Pi LAN address (no public exposure)
      - "10.166.46.195:9000:9000"
      - "10.166.46.195:9443:9443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${STORAGE_ROOT:-/mnt/storage}/app-data/portainer:/data

  vaultwarden:
    image: vaultwarden/server:1.33.2-alpine
    container_name: vaultwarden
    restart: unless-stopped
    environment:
      SIGNUPS_ALLOWED: "true"
    volumes:
      - ${STORAGE_ROOT:-/mnt/storage}/app-data/vaultwarden:/data
    ports:
      # Bound strictly to Raspberry Pi Tailscale address (no public exposure)
      - "100.96.171.29:8080:80"

  filebrowser:
    image: filebrowser/filebrowser:v2.63.23
    container_name: filebrowser
    restart: unless-stopped
    user: "1000:1000"
    ports:
      # Bound strictly to Raspberry Pi Tailscale address (no public exposure)
      - "100.96.171.29:8082:80"
    volumes:
      # Data directories exposed to user (app-data and backups are strictly excluded)
      - ${STORAGE_ROOT:-/mnt/storage}/documents:/srv/documents
      - ${STORAGE_ROOT:-/mnt/storage}/photos:/srv/photos
      - ${STORAGE_ROOT:-/mnt/storage}/videos:/srv/videos
      - ${STORAGE_ROOT:-/mnt/storage}/downloads:/srv/downloads
      # Persistent database and settings directories
      - ${STORAGE_ROOT:-/mnt/storage}/app-data/filebrowser/database:/database
      - ${STORAGE_ROOT:-/mnt/storage}/app-data/filebrowser/config:/config

networks:
  default:
    name: home-server-network
