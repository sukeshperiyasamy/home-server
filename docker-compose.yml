# ==============================================================================
# Home Server - Docker Compose Specification
# ==============================================================================
# This file serves as the single source of truth for services running on the
# home server.
#
# DESIGN PRINCIPLES:
# 1. Reproducible: Uses environment variables defined in .env
# 2. Portable: Persistent volumes bind mount directly to ${STORAGE_ROOT}/app-data
# 3. Pinned: Use explicit image versions rather than 'latest' where practical
# ==============================================================================

name: home-server

services:
  portainer:
    image: portainer/portainer-ce:2.27.1-alpine
    container_name: portainer
    restart: unless-stopped
    ports:
      # Bound strictly to Raspberry Pi LAN address (no public exposure)
      - "10.166.46.195:9000:9000"
      - "10.166.46.195:9443:9443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${STORAGE_ROOT:-/mnt/storage}/app-data/portainer:/data

networks:
  default:
    name: home-server-network
